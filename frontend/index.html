<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- KRDS 메인 블루 테마 컬러 적용 -->
  <meta name="theme-color" content="#0052A4">
  <title>한국기업평가 노조 - 시간외근무 기록</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            krds: {
              primary: '#0052A4',       /* KRDS 메인 블루 */
              primary_hover: '#003F80', /* 호버 상태 블루 */
              bg: '#F4F6FA',            /* 배경 회색 */
              surface: '#FFFFFF',       /* 컴포넌트 배경 */
              border: '#D1D5DB',        /* 기본 테두리 */
              text: '#111827',          /* 기본 텍스트 */
              subtext: '#4B5563',       /* 보조 텍스트 */
            }
          },
          fontFamily: {
            sans: ['"Pretendard"', '"Noto Sans KR"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style type="text/tailwindcss">
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    /* 데스크톱 환경에서는 바깥 배경을 회색으로 하여 앱 영역을 돋보이게 함 */
    body { 
      background-color: #E5E7EB; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    /* 기존 body에 있던 속성을 #app 컨테이너로 이동 (모바일 앱 느낌 구현) */
    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      background-color: #F4F6FA; /* 실제 앱 내부 배경색 */
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      position: relative;
    }
    
    @media(min-width: 481px){ 
      #app { 
        border-left: 1px solid #D1D5DB; 
        border-right: 1px solid #D1D5DB; 
      } 
    }
    
    .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>

  <!-- 파비콘: 단순 이모지 대신 세련된 빌딩 형태의 SVG 로고로 변경 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230052A4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Z'/></svg>">
</head>
<body class="text-krds-text font-sans antialiased">

  <!-- 로딩 오버레이: 공공기관 특유의 단정하고 신뢰감 있는 스피너 디자인 -->
  <div id="ld" class="hidden fixed inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-[9999] max-w-[480px] mx-auto">
    <div class="w-12 h-12 rounded-full border-[4px] border-krds-border border-t-krds-primary animate-spin"></div>
    <span id="ld-text" class="mt-4 text-[15px] font-bold text-krds-text">데이터를 불러오는 중입니다...</span>
  </div>

  <!-- 앱 컨테이너 -->
  <div id="app" class="flex flex-col safe-pb"></div>

  <!-- 실제 개발 스크립트 (기존 유지) -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
